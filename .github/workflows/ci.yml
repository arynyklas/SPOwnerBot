name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: install
        run: uv sync --locked --extra dev

      - name: config stub
        # config.py is gitignored; the example carries the names and types main.py imports
        run: cp config.py.example config.py

      - name: lint
        run: uv run ruff check

      - name: format-check
        run: uv run ruff format --check

      - name: typecheck
        run: uv run ty check
